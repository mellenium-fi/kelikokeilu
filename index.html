  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0.5rem;
    background: #f0f0f0;
  }

  h1, h2 {
    text-align: center;
  }

  /* Shared container for consistent width */
  .container {
    max-width: 1000px;   /* matches site cards */
    margin: 0 auto;
    padding: 0 0.5rem;
  }


  /* Top text with title + logo side by side */
  #top-text {
    max-width: 1000px;   /* match site cards */
    margin: 1rem auto;
    text-align: center;
  }

  #top-text .title-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5rem;
    margin-bottom: 0.5rem;
  }

  #top-text .title-logo {
    max-height: 60px;
    width: auto;
  }

  @media(max-width: 600px){
    #top-text .title-row {
      flex-direction: column;
      gap: 0.5rem;
    }

    #top-text .title-logo {
      max-height: 40px;
    }
  }


  .site-card {
    background: white;
    border-radius: 8px;
    padding: 1rem;
    margin: 1rem auto;       /* center the card */
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    max-width: 1000px;        /* limit total width */
  }

  .site-row {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .site-left {
    flex: 0 0 180px; /* fixed width, adjust as needed */
    font-size: 1rem;
  }

  .site-right {
    flex: 1;
    margin-left: 0.5rem;
    overflow-x: auto;  /* scrollable on mobile if needed */
  }

  .site-name {
    font-weight: bold;
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }

  .obs-temp {
    font-size: 2rem;
    font-weight: bold;
  }

  .obs-mobile-break {
    display: inline;
  }

  /* Forecast container */
  .forecast {
    display: flex;
    flex-direction: column;
    white-space: nowrap;
  }

  /* Each row (items and times) */
  .forecast-row {
    display: flex;
    flex-wrap: nowrap;
  }

  .forecast-item, .forecast-time {
    flex: 0 0 61px;
    text-align: center;
    font-size: 0.9rem;
    padding: 0.35rem;
    box-sizing: border-box;
  }

  .forecast-item {
    background: #e0e0e0;
    border-right: 1px solid white;
  }

  .forecast-item:last-child {
    border-right: none;
  }

  .forecast-time {
    background: transparent;
    font-size: 0.9rem;
    padding-top: 0.2rem;
  }

  #image-section {
    margin: 1rem auto;
    max-width: 1000px;
  }

  .aspect-ratio-box {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    overflow: hidden;
    border-radius: 8px;
  }

  .aspect-ratio-box iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  a img {
    border: none;       
  }
  a {
    text-decoration: none;
  }

  /* Mobile adjustments */
  @media(max-width: 600px){
    body {
      font-size: 0.9rem; /* smaller global font */
    }

    #top-text {
      flex-direction: column; /* stack title & logo vertically */
      gap: 0.5rem;
    }

    #top-text .title-logo {
      height: 40px; /* smaller logo on mobile */
    }

    .site-left {
      flex: 0 0 100px;
      font-size: 0.8rem;
    }

    .obs-mobile-break {
      display: block;
    }

    .obs-temp {
      font-size: 1.3rem; 
    }

    .forecast-item, .forecast-time {
      flex: 0 0 50px;   
      font-size: 0.8rem;
      padding: 0.2rem;
    }

  }

function formatObsTime(ts) {
  if (!ts) return "N/A";
  const date = new Date(ts*1000);
  date.setMinutes(Math.round(date.getMinutes()/10)*10);
  return date.toLocaleTimeString('fi-FI', {hour:'2-digit', minute:'2-digit'});
}

function buildForecastCells(forecasts) {
  const items = forecasts.map(f => {
    const emoji = f.d26 != null ? (D26_EMOJI_MAP[f.d26] || f.d26) : "N/A";
    //const road = f.d4 != null ? (D4_EMOJI_MAP[f.d4] || f.d4) : "N/A";
    const road = f.d4 != null ? (D4_EMOJI_MAP[f.d4] || f.d4) : D4_EMOJI_MAP[999];
    return `<div class="forecast-item">
              ${f.d1 != null ? Math.round(f.d1) + ' °C' : 'N/A'}<br>
              ${emoji}<br>
              ${road}
            </div>`;
  }).join("");

  const times = forecasts.map(f => {
    const hour = new Date(f.ts*1000).getHours().toString().padStart(2,'0');
    return `<div class="forecast-time">${hour}</div>`;
  }).join("");

  return `
    <div class="forecast-row">${items}</div>
    <div class="forecast-row">${times}</div>
  `;
}

function buildSiteCard(site) {
  const obs = site.observation || {};

  let obsD4 = "Huollossa";
  let obsD5 = "";
  if (obs.d4 != null && obs.d5 != null) {
    obsD4 = obs.d4 != null ? (D4_EMOJI_MAP[obs.d4] || obs.d4) : "N/A";
    obsD5 = obs.d5 != null ? obs.d5 + ' °C' : "N/A";
  }
  const obsD1 = obs.d1 != null ? obs.d1 + ' °C' : "N/A";
  const obsD26 = obs.d26 != null ? (D26_EMOJI_MAP[obs.d26] || obs.d26) : "N/A";
  const obsTime = formatObsTime(obs.ts);

  const forecastsHtml = buildForecastCells(site.forecasts || []);

  return `
    <div class="site-card">
      <div class="site-name">${site.site_name}</div>
      <div class="site-row">
        <div class="site-left">
          Tienpinta: <span class="obs-mobile-break">${obsD4} ${obsD5}</span>
          <span class="obs-temp">${obsD26} ${obsD1}</span><br>
          Klo: ${obsTime}
        </div>
        <div class="site-right">
          <div class="forecast">${forecastsHtml}</div>
        </div>
      </div>
    </div>
  `;
}



async function loadSites() {
  const container = document.getElementById("sites-container");
  try {
    const response = await fetch(apiUrl, {
      headers: { "x-api-key": "uwGUXamNWM7SPb6MDK7cb5Kf85BIQ0o41sOAVAnc" }
    });

    const raw = await response.json();
    if (!raw.sites || !Array.isArray(raw.sites)) {
      console.error("Unexpected API shape:", raw);
      container.innerHTML = "<p>Error: Unexpected data from API</p>";
      return;
    }
    container.innerHTML = raw.sites.map(buildSiteCard).join("");
  } catch(err) {
    console.error("Error loading sites:", err);
    container.innerHTML = "<p>Error loading sites</p>";
  }
}

window.addEventListener("DOMContentLoaded", loadSites);
